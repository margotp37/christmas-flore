<!DOCTYPE html>
<html lang="fr">
  <head>
      <meta charset="utf-8">
      <title>Compte à rebours de Noël</title>
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <!-- CSS LINKS -->
      <link href="resources/css/reset.css" rel="stylesheet" type="text/css">
      <link href="resources/css/style.css" type="text/css" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Rochester" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Amatic+SC|Tangerine" rel="stylesheet">
      <!-- META TAGS -->
      <meta name="author" content="Alexander Wilson van Deurs">

      <!-- JS FILES -->
      <script src="./resources/js/snowstorm-min.js"></script>

      <style>
        /* Centre et abaisse le texte du bas */
        .bottom .side-note {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px; /* diminue cette valeur pour descendre le texte, augmente-la pour le monter */
            width: 100%;
            text-align: center;
        }

        .bottom .side-note h4 {
            margin: 5px 0;
        }
      </style>
  </head>
  <body>
    <div class="container">

        <div class="top section">
            <div class="top-left thing"></div>
            <header>
                <h1>Compte à rebours de Noël</h1>
            </header>
            <div class="top-right thing"></div>
        </div>

        <div class="mid section">
            <div class="main-counter" id="clockdiv">
                <div class="counter">
                    <h2 class="days"></h2>
                    <h2>dodos</h2>
                </div>
                <div class="counter">
                    <h2 class="hours"></h2>
                    <h2>heures</h2>
                </div>
                <div class="counter">
                    <h2 class="minutes"></h2>
                    <h2>minutes</h2>
                </div>
                <div class="counter">
                    <h2 class="seconds"></h2>
                    <h2>secondes</h2>
                </div>
            </div>
            <div class="side-note">
                <h4>Jusqu'à l'arrivée du <span id="santa">Père Noël</span></h4>
            </div>
        </div>

        <div class="bottom section">
            <div class="side-note">
                <br>
                <h4>
                    Et <span id="flore-days"></span> dodos jusqu'à l'anniversaire de
                    <span id="flore">Flore</span> !
                </h4>
            </div>
        </div>

    </div>

    <script>
        // Compte à rebours de Noël (25 décembre, minuit)
        function updateChristmas() {
            var now = new Date();
            var noel = new Date(now.getFullYear(), 11, 25, 0, 0, 0);

            if (noel < now) {
                noel.setFullYear(now.getFullYear() + 1);
            }

            var diff = noel - now;
            var clock = document.getElementById('clockdiv');

            clock.querySelector('.days').textContent = Math.floor(diff / (1000 * 60 * 60 * 24));
            clock.querySelector('.hours').textContent = Math.floor((diff / (1000 * 60 * 60)) % 24);
            clock.querySelector('.minutes').textContent = Math.floor((diff / (1000 * 60)) % 60);
            clock.querySelector('.seconds').textContent = Math.floor((diff / 1000) % 60);
        }

        // Compte à rebours de l'anniversaire de Flore (12 novembre)
        function updateFlore() {
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var birthday = new Date(now.getFullYear(), 10, 12); // 10 = novembre (janvier = 0)

            if (birthday < today) {
                birthday.setFullYear(now.getFullYear() + 1);
            }

            var days = Math.round((birthday - today) / (1000 * 60 * 60 * 24));
            document.getElementById('flore-days').textContent = days;
        }

        function update() {
            updateChristmas();
            updateFlore();
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
